{% extends "base.html" %}
{% block title %}Faire une annonce{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-head">
    <div>
      <p class="kicker">Communication</p>
      <h1 class="page-title">Faire une annonce</h1>
      <p class="page-sub">L’annonce sera visible par tous les utilisateurs, dès sa publication.</p>
    </div>
  </div>

  <form method="post" class="form-card">
    {% csrf_token %}
    {% include "interventions/_form_fields.html" %}
    <div class="form-actions">
      <button class="btn btn--primary" type="submit">Publier l’annonce</button>
      <a class="btn btn--ghost" href="{% url 'annonces' %}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
