{% extends "base.html" %}
{% block title %}Catégories{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Catégories de problèmes</h1>
<div class="list-group">
  {% for c in categories %}
    <div class="list-group-item d-flex justify-content-between align-items-start">
      <div><div class="fw-semibold">{{ c.nom }}</div><div class="small text-muted">{{ c.description }}</div></div>
      <span class="badge text-bg-secondary">{{ c.nb_signalements }} demande{{ c.nb_signalements|pluralize }}</span>
    </div>
  {% empty %}
    <div class="alert alert-info">Aucune catégorie.</div>
  {% endfor %}
</div>
{% endblock %}
